# CI/CD multi-stage en Azure Pipelines (días 19 a 21): build y tests, smoke test y deploy a dev y prod.
# No corre desde GitHub: hay que crear el pipeline en Azure DevOps apuntando a este archivo
# (Pipelines > New pipeline > GitHub > este repo > Existing Azure Pipelines YAML file).

# Parámetro de runtime: aparece como checkbox en "Run pipeline".
parameters:
  - name: runFrontend
    displayName: Incluir el frontend
    type: boolean
    default: true

trigger:
  branches:
    include: [main]

pr:
  branches:
    include: [main]

variables:
  buildConfiguration: Release
  NUGET_PACKAGES: $(Pipeline.Workspace)/.nuget/packages   # la usa dotnet restore y la cache
  # Hay que crearlos en Azure antes del primer deploy (ver docs/bloque-7-pipeline.md).
  azureServiceConnection: upskill-azure
  webAppDev: upskill-tgv-api-dev
  webAppProd: upskill-tgv-api

stages:
  - stage: Build
    displayName: Build y tests
    jobs:
      - job: backend
        displayName: Backend .NET
        pool:
          vmImage: ubuntu-latest
        steps:
          - template: pipelines/templates/dotnet-build-test.yml
            parameters:
              workingDirectory: backend
              buildConfiguration: $(buildConfiguration)
              coverageSettings: backend/Upskill.Api.Tests/coverage.config

          - script: >
              dotnet publish Upskill.Api --no-build --configuration $(buildConfiguration)
              --output $(Build.ArtifactStagingDirectory)/api
            displayName: dotnet publish
            workingDirectory: backend

          # Artefacto: lo que el stage siguiente (y el deploy) descarga, sin recompilar.
          - publish: $(Build.ArtifactStagingDirectory)/api
            artifact: api
            displayName: Publicar artefacto api

      # Inserción condicional al compilar el YAML, según el parámetro de runtime.
      - ${{ if eq(parameters.runFrontend, true) }}:
        - job: frontend
          displayName: Frontend Vue
          pool:
            vmImage: ubuntu-latest
          steps:
            - template: pipelines/templates/node-build-test.yml
              parameters:
                workingDirectory: frontend

            - publish: frontend/dist
              artifact: web
              displayName: Publicar artefacto web

  - stage: Smoke
    displayName: Smoke test del artefacto
    dependsOn: Build
    jobs:
      - job: api
        displayName: Levantar la API publicada
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: none            # solo usa el artefacto, no el código
          - download: current
            artifact: api
            displayName: Descargar artefacto api

          - task: UseDotNet@2
            displayName: Runtime de ASP.NET Core 10
            inputs:
              packageType: runtime
              version: 10.0.x

          - script: |
              cd "$(Pipeline.Workspace)/api"
              dotnet Upskill.Api.dll --urls http://localhost:5000 &
              for i in $(seq 1 30); do curl -sf http://localhost:5000/health && exit 0; sleep 1; done
              echo "La API no respondió /health" && exit 1
            displayName: GET /health

  # Deploy solo desde main (no en PRs). Los stages leen los nombres en compilación, por eso ${{ variables.x }}.
  - stage: DeployDev
    displayName: Deploy a dev
    dependsOn: Smoke
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - template: pipelines/templates/deploy-webapp.yml
        parameters:
          environment: upskill-dev
          serviceConnection: ${{ variables.azureServiceConnection }}
          webAppName: ${{ variables.webAppDev }}

  # La aprobación manual no va en el YAML: se configura en el environment upskill-prod (Approvals and checks).
  - stage: DeployProd
    displayName: Deploy a prod
    dependsOn: DeployDev
    jobs:
      - template: pipelines/templates/deploy-webapp.yml
        parameters:
          environment: upskill-prod
          serviceConnection: ${{ variables.azureServiceConnection }}
          webAppName: ${{ variables.webAppProd }}
