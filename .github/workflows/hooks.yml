name: hooks

on:
  pull_request:
    paths: ['.github/hooks/**', 'scripts/**', '.github/workflows/hooks.yml']
  push:
    branches: [main]
    paths: ['.github/hooks/**', 'scripts/**', '.github/workflows/hooks.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: scripts/check.sh hooks
      - run: bash -n scripts/check.sh
