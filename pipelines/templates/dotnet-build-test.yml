# Step template: build + tests con cobertura de una solución .NET.
parameters:
  - name: workingDirectory
    type: string
  - name: buildConfiguration
    type: string
    default: Release
  - name: dotnetVersion
    type: string
    default: 10.0.x
  - name: coverageSettings
    type: string
    default: ''

steps:
  - task: UseDotNet@2
    displayName: Instalar .NET ${{ parameters.dotnetVersion }}
    inputs:
      packageType: sdk
      version: ${{ parameters.dotnetVersion }}

  # NuGet a una carpeta propia para poder cachearla entre corridas.
  - task: Cache@2
    displayName: Cache de NuGet
    inputs:
      key: 'nuget | "$(Agent.OS)" | ${{ parameters.workingDirectory }}/**/*.csproj'
      path: $(NUGET_PACKAGES)

  - script: dotnet build --configuration ${{ parameters.buildConfiguration }} -warnaserror
    displayName: Build
    workingDirectory: ${{ parameters.workingDirectory }}

  # ${{ if }} / ${{ else }}: se resuelve al compilar el YAML, antes de que arranque el job.
  - ${{ if eq(parameters.coverageSettings, '') }}:
    - script: >
        dotnet test --no-build --configuration ${{ parameters.buildConfiguration }}
        --report-trx --results-directory $(Agent.TempDirectory)/tests
      displayName: Tests
      workingDirectory: ${{ parameters.workingDirectory }}
  - ${{ else }}:
    - script: >
        dotnet test --no-build --configuration ${{ parameters.buildConfiguration }}
        --report-trx --results-directory $(Agent.TempDirectory)/tests
        --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
        --coverage-settings $(Build.SourcesDirectory)/${{ parameters.coverageSettings }}
      displayName: Tests con cobertura
      workingDirectory: ${{ parameters.workingDirectory }}

  - task: PublishTestResults@2
    displayName: Publicar resultados de tests
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: $(Agent.TempDirectory)/tests/**/*.trx
      testRunTitle: ${{ parameters.workingDirectory }}

  - ${{ if ne(parameters.coverageSettings, '') }}:
    - task: PublishCodeCoverageResults@2
      displayName: Publicar cobertura
      inputs:
        summaryFileLocation: $(Agent.TempDirectory)/tests/coverage.cobertura.xml
