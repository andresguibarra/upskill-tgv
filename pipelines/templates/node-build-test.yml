# Step template: type-check, tests (JUnit) y build de una app de Node.
parameters:
  - name: workingDirectory
    type: string
  - name: nodeVersion
    type: string
    default: 22.x

steps:
  - task: NodeTool@0
    displayName: Instalar Node ${{ parameters.nodeVersion }}
    inputs:
      versionSpec: ${{ parameters.nodeVersion }}

  - task: Cache@2
    displayName: Cache de npm
    inputs:
      key: 'npm | "$(Agent.OS)" | ${{ parameters.workingDirectory }}/package-lock.json'
      path: $(Pipeline.Workspace)/.npm

  - script: npm ci --cache $(Pipeline.Workspace)/.npm
    displayName: npm ci
    workingDirectory: ${{ parameters.workingDirectory }}

  - script: |
      npm run type-check
      npx vitest run --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml
      npm run build-only
    displayName: Type-check, tests y build
    workingDirectory: ${{ parameters.workingDirectory }}

  - task: PublishTestResults@2
    displayName: Publicar resultados de tests
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: ${{ parameters.workingDirectory }}/test-results/junit.xml
      testRunTitle: ${{ parameters.workingDirectory }}
